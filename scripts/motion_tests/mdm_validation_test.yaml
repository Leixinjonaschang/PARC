input_terrains: $DATA_DIR/tests/val_tests/demo/spiral/spiral.yaml # its `terrains:` is one MS file or a list
mdm_model: $DATA_DIR/tests/train_mdm/parkour_dataset_v_21_test01/checkpoints/model_30000.ckpt
output_folder: $DATA_DIR/tests/val_tests/demo/spiral/
#device: "cuda:0" # default: cuda:0 if available, else cpu
use_ema_model: False

mdm_path:
  next_node_lookahead: 7
  rewind_num_frames: 5
  end_of_path_buffer: 2
  max_motion_length: 30.0
  #path_batch_size: 16 # not used in this script
  mdm_batch_size: 32
  top_k: 4
  w_target: 2.0
  w_contact: 0.1
  w_pen: 0.1

mdm_gen:
  use_prev_state: True
  use_cfg: True
  cfg_scale: 0.5
  prev_state_ind_key: True
  target_condition_key: True
  use_ddim: True
  ddim_stride: 5
