# G1 pipeline smoke, stage 1: tiny MDM training.
# Copy of data/configs/parc_1_train_gen_g1.yaml; changed keys are marked "# smoke".
# Only the run length and the network size change (the network is upstream's default
# size); the G1 features and losses (hf collision, target) stay on.
# parc_0_setup_iter.py writes the stage config from this file and sets char_file,
# motion_lib_file, output_dir, sampler_save_filepath and sampler_stats_filepath.
use_wandb: False # smoke
device: "cuda:0"
diffusion_timesteps: 21 # smoke
epochs: 2 # smoke
epochs_per_checkpoint: 1 # smoke
batch_size: 4 # smoke
dropout: 0.1
obs_dropout: 0.025
target_dropout: 0.025
feature_vector_attention_dropout: 0.05
prev_state_attention_dropout: 0.15
iters_per_epoch: 2 # smoke
lr: 0.00001
weight_decay: 0.01
test_size: 16 # smoke
test_ddim_stride: 50
test_mode: "MODE_DDIM"
predict_mode: "PREDICT_X0"

EMA:
    ema_decay: 0.99
    ema_start: 200
    ema_update_rate: 1

features:
  frame_components: ["ROOT_POS", "ROOT_ROT", "JOINT_POS", "JOINT_ROT", "CONTACTS"]
  rot_type: "DEFAULT" #ROT_6D, EXP_MAP, AXIS_ANGLE, QUAT, ROT_MAT
  prime_joint_comp: "rot" #rot
  canonicalize_samples: True

# for loading and continuing to train a pre-trained model
#input_model_path: "$DATA_DIR/tests/parc/experiment_g1/iter_1/p1_train_gen/checkpoints/model_2500.ckpt"
train_loss_fn: "squared_l2"
test_loss_fn: "squared_l2"

autoregressive: True

# transformer network
d_model: 256 # smoke
num_heads: 8 # smoke
d_hid: 256 # smoke
num_layers: 4 # smoke

target_mlp_layers: [512]

in_mlp_layers: [256] # smoke
out_mlp_layers: [256] # smoke

# geometric loss weights
w_simple_root_pos: 1.0
w_simple_root_rot: 1.0
w_simple_joint_rot: 0.5
w_simple_contacts: 1.0
w_simple_body_pos: 0.5
w_body_pos_consistency: 1.0
w_vel_root_pos: 0.5
w_vel_root_rot: 0.02
w_vel_joint_rot: 0.01
w_body_pos: 0.5 #1.0 # 1/15 * 1/3
w_body_rot: 0.1
w_body_vel: 0.03
w_target: 0.02
w_hf: 15.0

use_pos_loss: True
use_hf_collision_loss: True # G1 (develop)
use_target_loss: True # G1 (develop)

motion_lib_file: "$DATA_DIR/tests/parc/experiment_g1/iter_1/iter_1_start_motions.yaml" # G1
sampler_save_filepath: "$DATA_DIR/tests/parc/experiment_g1/iter_1/p1_train_gen/sampler.pkl" # G1
sampler_stats_filepath: "$DATA_DIR/tests/parc/experiment_g1/iter_1/p1_train_gen/sampler_stats.txt" # G1
output_dir: "$DATA_DIR/tests/parc/experiment_g1/iter_1/p1_train_gen/" # G1
char_file: "data/assets/unitree_g1/g1_mocap_29dof.xml" # G1
sequence_duration: 0.5 # seconds
sequence_fps: 30

# Condition tokens
prev_state_noise_ind_chance: 0.5 # higher means more likely to use clean signal when training
num_prev_states: 2
use_heightmap_obs: True
use_hf_augmentation: True

# options: "RELATIVE_TO_ROOT_FLOOR", "RELATIVE_TO_ROOT"
relative_z_style: "RELATIVE_TO_ROOT"

# For augmenter
hf_augmentation_mode: "MAXPOOL_AND_BOXES"
max_num_boxes: 4
box_min_len: 2
box_max_len: 12
hf_maxpool_chance: 0.15 # will be rolled 3 times
hf_max_maxpool_size: 10
hf_change_height_chance: 0.1

angle_noise_scale: 0.01
pos_noise_scale: 0.01

use_target_obs: True
target_type: "XY_DIR"
target_dir_len_eps: 0.1
target_dir_heading_eps: 0.5
future_pos_noise_scale: 0.05 # using normal distribution

heightmap:
  horizontal_scale: 0.2
  local_grid:
    num_x_neg: 10
    num_x_pos: 20
    num_y_neg: 15
    num_y_pos: 15
  max_h: 3.0

cnn:
  net_name: "cnn_31xy_4layer_c64_out64"

future_window_min: 0.4 # seconds
future_window_max: 1.5 # seconds
