# G0 smoke S5: short humanoid tracker training through scripts/parc_3_tracker.py,
# using the default humanoid env and agent configs.
env_config: "data/configs/tracker_config/dm_env_default.yaml"
agent_config: "data/configs/tracker_config/dm_agent_default.yaml"
output_dir: "output/smoke/p3_tracker/"
num_envs: 64
# 64 envs x 32 steps = 2048 samples per iteration, so this runs 201 iterations.
# dm_agent_default.yaml writes model.pt every 200 iterations (and at iteration 0),
# so model.pt ends up holding the iteration-200 weights.
max_samples: 410000
device: "cuda:0"
dataset_file: "output/smoke/motions.yaml"
in_model_file: null
create_dataset_config: "tests/smoke/create_dataset_smoke.yaml"
