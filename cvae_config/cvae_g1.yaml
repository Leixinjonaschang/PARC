# CVAE Configuration for PARC
# This config is used for standalone CVAE training

cvae:
  enabled: True
  latent_dim: 128
  encoder_hidden_dims: [1024, 1024, 512]
  decoder_hidden_dims: [512, 2048, 1024, 512]
  prior_hidden_dims: [512, 256]
  beta: 0.1
  learning_rate: 1e-4
  batch_size: 256
  num_batches: 16
  update_interval: 10
  buffer_size: 10000

  # WandB Logger Configuration
  logging:
    use_wandb: True
    project_name: "parkour_cvae"
    exp_name: "cvae_g1_code_test"

  # DAgger configuration
  dagger:
    enabled: True
    num_iterations: 2
    student_rollouts_per_iter: 1000
    expert_rollouts_per_iter: 100
    mix_ratio: 0.5
    buffer_size: 32768

  # Teacher model checkpoint for distillation
  teacher_checkpoint:
    enabled: True
    checkpoint_path: "/home/phi/CLX/projects/humanoid_loco/tests/parc/experiment_g1/iter_1/p3_tracker/checkpoints/model_0000046400.pt"
    actor_only: True

# Output configuration
output_dir: "/home/phi/CLX/projects/humanoid_loco/tests/parc/cvae_training/"
save_interval: 10
max_iterations: 100  

# Hardware & Parallel Setup
device: "cuda:0"
num_envs: 512